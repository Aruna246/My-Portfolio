<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Warm amber-orange gradient matching portfolio theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#78350F" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Warm Amber Gradient -->
  <rect x="8" y="8" width="112" height="112" rx="30" ry="30" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Subtle Elegant Inner Border -->
  <rect x="9.5" y="9.5" width="109" height="109" rx="28.5" ry="28.5" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Iconic Letter 'I' with Modern Serif / Architectural Proportions -->
  <!-- Top Bar -->
  <rect x="36" y="28" width="56" height="12" rx="6" fill="url(#letterGrad)" />
  
  <!-- Center Stem -->
  <rect x="54" y="34" width="20" height="60" rx="4" fill="url(#letterGrad)" />
  
  <!-- Bottom Bar -->
  <rect x="36" y="88" width="56" height="12" rx="6" fill="url(#letterGrad)" />

  <!-- Tiny Sparkling Golden Stardust Node on top-right -->
  <circle cx="88" cy="26" r="4.5" fill="#FEF08A" />
</svg>
